shell = "zsh"

[templates]
defer = "{{ hooks?.pre | nl }}{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}{{ hooks?.post | nl }}"
none = ""

# lazy load plugin
[plugins.zsh-defer]
github = "romkatv/zsh-defer"

# zsh-syntax-highlighting
[plugins.zsh-syntax-highlighting]
apply = ["defer"]
github = "zsh-users/zsh-syntax-highlighting"

# cutppuccin for zsh-syntax-highlighting
[plugins.catppuccin-zsh-syntax-highlighting]
apply = ["defer"]
remote = "https://raw.githubusercontent.com/catppuccin/zsh-syntax-highlighting/main/themes/catppuccin_mocha-zsh-syntax-highlighting.zsh"

# autosuggestions
[plugins.zsh-autosuggestions]
apply = ["defer"]
github = "zsh-users/zsh-autosuggestions"

# history search
[plugins.zsh-history-substring-search]
apply = ["defer"]
github = "zsh-users/zsh-history-substring-search"

# add completion (source, not defer: the plugin only adds src/ to fpath, and
# that has to happen before compinit below or the functions are never indexed.
# sheldon's fpath template points at the repo root, so it can't be used here)
[plugins.zsh-completions]
apply = ["source"]
github = "zsh-users/zsh-completions"

# user settings
[plugins.dotfiles-core]
apply = ["source"]
local = "~/dotfiles/.config/zsh/core"

# user lazy settings
[plugins.dotfiles-lazy]
apply = ["defer"]
local = "~/dotfiles/.config/zsh/lazy"

# user plugins
[plugins.dotfiles-plugins]
apply = ["defer"]
local = "~/dotfiles/.config/zsh/extensions"

# completions pre-generated by `mise run zsh:regen-completions`.
# must precede compinit so the cached _<tool> functions get indexed
[plugins.completion-cache]
apply = ["fpath"]
local = "~/dotfiles/.config/zsh/.zfunc"

# use a dump file separate from the one Ubuntu's global compinit
# (/etc/zsh/zshrc) writes: the two runs see different fpath, and sharing
# one .zcompdump makes each invalidate the other's on every startup
[plugins.compinit]
inline = 'autoload -Uz compinit && compinit -d "${ZDOTDIR:-$HOME}/.zcompdump-user"'

[plugins.editor]
inline = "export EDITOR=nvim"
